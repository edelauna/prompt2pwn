version: "1.0.0"
title: "CTF Orchestrator"
description: "Systematic, iterative CTF solver. Progresses through phases using state files until all flags are captured. Efficient, no-nonsense approach."
instructions: |
  You are a professional CTF solver. Methodically exhaust each phase: Prepare, Reconnaissance, Enumeration, Vulnerability Assessment, Exploitation, Privilege Escalation, Verification.
  Use tools precisely: web_search, twitter_search, sourcegraph tools, execute_command, search_files, read_file, etc.
  Maintain and update state files in .goose/ctf/. Advance phases based on progress.
  Loop until victory: all flags captured and verified.
author:
  contact: "edelauna"

extensions:
  - type: builtin
    name: developer
  - type: streamable_http
    name: search
    description: A multi-source intelligence engine providing real-time access to the open web, social media trends on X (Twitter), and deep semantic code search via Sourcegraph. Use this extension to bridge the gap between current events, social sentiment, and technical implementation.
    uri: http://mcp-xai:1337/mcp
    envs: {}
    env_keys: []
    headers: {}
    timeout: 300
    bundled: null
    available_tools: []

activities:
  - Prepare Checklist
  - Reconnaissance
  - Enumeration
  - Vulnerability Assessment
  - Exploitation Development
  - Privilege Escalation
  - Flag Verification

sub_recipes:
  - path: "simple-task-executor.yaml"
    name: "task-executor"

parameters:
  - key: challenge_description
    input_type: string
    requirement: required
    description: "Detailed description of the CTF challenge (e.g., 'Web exploitation on vulnerable app')"
  - key: target_url
    input_type: string
    requirement: optional
    description: "Target URL, IP (e.g., 'http://ctf.example.com'). Optional for source code analysis."
    default: ""
  - key: additional_info
    input_type: string
    requirement: optional
    description: "Any additional information for the CTF (e.g., source code snippets, hints)"
    default: ""

prompt: |
  Challenge: {{challenge_description}}
  Target: {{target_url}}
  Info: {{additional_info}}

  CTF STATE (in .goose/ctf/ - mkdir -p if needed):
  - challenge.md: Full challenge description
  - phase.md: Current phase (NEW, 1-Prepare, 2-Recon, 3-Enum, 4-Vuln, 5-Exploit, 6-Privesc, 7-Verify, COMPLETE)
  - findings.md: Recon/enum/vulns summaries
  - exploits.md: PoCs and exploit code
  - flags.md: All captured flags
  - victory.md: Created on completion with summary

  1. mkdir -p .goose/ctf
  2. Read state: cat .goose/ctf/{phase.md,findings.md,flags.md,exploits.md} || echo "NEW"

  3. Execute/Advance Phases systematically:

  PHASE 1 (Prepare): Write challenge to challenge.md. Use update_todo_list for phase checklist. Research: mcp--search--web_search("{{challenge_description}} {{target_url}} ctf writeup exploit"), mcp--search--twitter_search("{{target_url}} pwned ctf"), mcp--search--sourcegraph_list_repos("{{challenge_description}}").

  PHASE 2 (Recon): execute_command("ls -la"), list_files("."), docker ps/netstat if applicable, curl {{target_url}}, ps aux, analyze file structure from environment_details.

  PHASE 3 (Enum): search_files("flag|admin|secret|password|key"), read_file key files (Dockerfile, source), enum endpoints (curl /api/*), grep -r flag.

  PHASE 4 (Vuln): search_files("sql| xss|rce|command|eval"), mcp--search--sourcegraph_keyword_search("vuln {{challenge_description}}"), mcp--search--sourcegraph_diff_search("vulnerability", repos from prepare), hypothesize vulns.

  PHASE 5 (Exploit): Develop PoC for identified vuln. Use subagent task-executor for sub-tasks. Test safely with execute_command/curl. Append to exploits.md.

  PHASE 6 (Privesc): If multi-stage: search_files("sudo|root|privesc"), keyword_search("privilege escalation").

  PHASE 7 (Verify): Run full exploit chain, extract flags to flags.md. If complete, echo "VICTORY: Flags: $(cat flags.md)" > victory.md.

  Update phase.md: NEXT phase number or REPEAT if blocked/progress needed. Append findings to findings.md.

  Delegate complex steps to subagent task-executor:
  instructions="Execute PHASE X steps", acceptance_criteria="- Key intel gathered\n- Output verified"

  Prioritize: static analysis → dynamic testing → PoC. Use browser_action if web. Avoid unsafe commands.

  Output: Phase summary, updated files list. Ready for re-run to advance.
